[project]
name = "rag-params-finder"
version = "0.12.0"
description = "RAG parameter sweep experimentation tool with MongoDB Atlas Vector Search and Voyage AI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pymongo>=4.18.2",
    "voyageai>=0.2.3",
    "pypdf>=6.21.4",
    "langchain>=0.1.0",
    "langchain-text-splitters>=0.0.1",
    "tiktoken>=0.5.0",
    "nltk>=3.10.3",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.14.2",
    "typer>=0.9.0",
    "httpx>=0.26.0",
    "rich>=13.7.0",
    # Postgres/pgvector backend (Supabase hosted + local Docker) — STORAGE_BACKEND=postgres.
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.6",
    "sentence-transformers>=2.6.0,<4.0.0",
    # sie-sdk requires numpy>=2; torch must be NumPy-2-compatible (see override-dependencies).
    "numpy>=2,<3",
    "sie-sdk>=0.6.0",
    "aim>=3.0",
    "optuna>=3.0",
    # DoubleWord batch embedding provider (OpenAI-compatible API)
    "openai>=1.35.0",
]

[project.optional-dependencies]
elasticsearch = ["elasticsearch>=9,<10"]
redis = ["redis>=5.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-testmon>=2.1.0",
    "pytest-xdist[psutil]>=3.5.0",
    "ruff>=0.16.8,<0.18",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.0",
    "pre-commit>=3.6.0",
    "pip-audit>=2.7.0",
    "bandit>=1.7.8",
    "radon>=6.0.0",
    "xenon>=0.9.0",
    # mando (radon/xenon) imports six.moves but does not declare a floor. Without one, the
    # unlocked CI install (`pip install .[dev]`) backtracks aim->boto3->bcdoc to six==1.7.3,
    # whose import hook is broken on Python 3.12 ("No module named 'six.moves'").
    "six>=1.16",
    "vulture>=2.11",
    "pip>=26.2",
]

[project.scripts]
rag-params-finder = "cli.main:app"

[tool.uv]
# Intel macOS dropped: torch>=2.6 (needed for numpy>=2 / sie-sdk) has no x86_64 Darwin wheels.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]
override-dependencies = [
    "urllib3>=2.7.0",
    "starlette>=1.3.1",
    "idna>=3.15",
    "langchain-core>=1.3.3",
    "aiohttp>=3.14.4",
    "msgpack>=1.2.3",
    "pillow>=13.0.0",
    # sentence-transformers pulls torch 2.2.x (NumPy 1.x ABI). Force a build that
    # works with numpy>=2 required by sie-sdk (else: RuntimeError "Numpy is not available").
    "torch>=2.6.0",
    # virtualenv — CVE-2026-113714/113715/113717/113718/113720/113722/113723/113725/113732/113776 fixed in 21.14.9
    "virtualenv>=21.14.9",
    # certifi — PYSEC-2026-4320 fixed in 2026.10.18
    "certifi>=2026.10.18",
    # dnspython — CVE-2026-114605 fixed in 2.9.0
    "dnspython>=2.9.0",
    # filelock — CVE-2026-112907/112909/112910/112913/112915/112935/112936/112939/112940 fixed in 4.0.9
    "filelock>=4.0.9",
    # setuptools — GHSA-xmj3-9gf7-h52w fixed in 84.1.0
    "setuptools>=84.1.0",
]

# Route torch to the CPU-only PyTorch index on Linux (Docker builds / CI).
# torch>=2.6 on Linux otherwise pulls nvidia-cublas/cudnn (~4 GB of CUDA libraries)
# that fill the Docker layer cache and are unused in CPU-only inference containers.
# macOS ARM wheels from PyPI are already CPU-only, so no source override is needed there.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cli*", "server*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Migration scripts use long help strings and comments that are hard to break.
"scripts/migrate/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: tests requiring MongoDB Atlas or network (excluded by default)",
    "slow: tests taking >1s in isolation (excluded by default)",
]

[tool.coverage.run]
# Full backend scope — all of server/ and cli/ (not selective modules).
# Integration-only paths (Postgres/Mongo adapters, embedders) are exercised
# by integration tests excluded from the unit tier, so full coverage lands ~62%.
source = ["server", "cli"]
branch = true

[tool.coverage.report]
show_missing = true
# Full backend floor — combined (statements+branches) as reported by coverage.py.
# Baseline 2026-08-07: 59.1% combined → raised 2026-08-07 to 70.1% after gap bridging.
# Per-metric floors (stmts/br/lines) enforced by check_backend_coverage_floors.py (72/59/72).
fail_under = 70
precision = 1

# FE-only thresholds — used by check_coverage_threshold_drift.py to lock
# frontend/vite.config.ts ↔ pyproject. Intentionally separate from BE floors
# (FE measures all src/**; BE unit-tier ~62% due to excluded integration paths).
# ``functions`` is Vitest-only; declared here for the drift check.
[tool.rag_params_finder.coverage_thresholds]
statements = 95
branches = 90
lines = 95
functions = 95

# Full backend per-metric floors (unit-tier, server/ + cli/).
# Baseline 2026-08-07: statements=72.7%, branches=59.8%, lines=72.7%
# (combined percent_covered = 70.1% — that is what --cov-fail-under uses).
# Target: raise toward 95/90/95 as integration paths get unit tests.
# Read by scripts/ci/check_backend_coverage_floors.py.
[tool.rag_params_finder.backend_coverage_thresholds]
statements = 72
branches = 59
lines = 72

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.vulture]
paths = ["server", "cli"]
min_confidence = 80
# Pydantic `@field_validator` classmethods must accept `cls` even when unused.
ignore_names = ["cls"]

# Transitive ML stack (torch/transformers via sentence-transformers) — tracked; major upgrade deferred.
# The current compensating control is an allowlisted model registry; arbitrary HuggingFace IDs are rejected.
# Ignores are applied in scripts/pip-audit.sh (pip-audit has no pyproject config).

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
