# Postgres + pgvector — local models (no API key, no cloud account)
#
# Small sweep: 1 embedding model × 2 chunking methods × 2 chunk sizes × 1 overlap
#              × 1 retriever = 4 runs. Kept short because it is the smoke test
#              for the Postgres backend, not a parameter search.
#
# Embedding: all-MiniLM-L6-v2 (384-dim) → chunks.embedding_384
# Retriever: dense only — sparse and hybrid land on Postgres in Slice 35.
#
# Prerequisites:
#   ./start-services.sh --postgres
#   export STORAGE_BACKEND=postgres
#   export DATABASE_URL=postgresql://rag:rag@localhost:5433/rag_params_finder
#
# The server applies server/db/schema.sql on boot, so there is no manual index
# step — unlike the Atlas path, which needs search indexes created up front.

experiment_name: example-postgres-local

data_paths:
  - ./input_data/pdfs/The_Federal_Pell_Grant_Program.pdf

queries_file: ./configs/questions.example.json

database_provider: postgres

embedding:
  provider: local
  models:
    - all-MiniLM-L6-v2    # 384-dim, no API key needed

chunking:
  methods:
    - fixed
    - recursive
  params:
    chunk_sizes: [256, 512]
    overlaps: [50]
    paddings: [0]

retrieval:
  top_k_initial: 20
  top_k_final: 5
  retrievers:
    - type: dense   # pgvector cosine, always filtered by embedding_model

execution:
  parallelism: 1
  on_error: continue
