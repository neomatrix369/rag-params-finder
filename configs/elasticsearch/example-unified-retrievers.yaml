# Elasticsearch — local vector store (run state is a separate database)
#
# Prerequisite: ./start-services.sh --elasticsearch-local
#   Starts Elasticsearch 9.5 on 127.0.0.1:9200 (Basic licence, security off, 1 GB heap)
#   and the paired run-state store (default postgres-local).
#   Install the client extra: uv pip install -e ".[elasticsearch]"
#   See docs/user-guide/elasticsearch-setup.md
#
experiment_name: example-elasticsearch-unified-retrievers

data_paths:
  - ./input_data/pdfs/The_Federal_Pell_Grant_Program.pdf

queries_file: ./configs/questions.example.json

database_provider: elasticsearch

embedding:
  provider: local
  models:
    - all-MiniLM-L6-v2    # 384-dim, no API key needed

chunking:
  methods:
    - recursive   # LangChain recursive splitter
    - semantic    # Sentence-transformers cosine similarity grouping
  params:
    chunk_sizes: [512, 1024]
    overlaps: [50]

# NEW: Unified retriever configuration
retrieval:
  top_k_initial: 20  # Candidates from traditional retrieval
  top_k_final: 5     # Final results after reranking
  retrievers:
    # Each entry is one sweep dimension — one retriever per run (never combined).
    - type: dense
    - type: sparse   # requires text_search_index
    - type: hybrid
    - type: cross_encoder
      provider: local
      model: cross-encoder/ms-marco-MiniLM-L-6-v2

execution:
  parallelism: 1
  on_error: continue
