# Redis — local vector store (run state is a separate database)
#
# Prerequisite: ./start-services.sh --redis-local
#   Starts Redis 8 on 127.0.0.1:6379 (volatile-lru eviction, AOF enabled)
#   and the paired run-state store (default sqlite, ADR-008).
#   Install the client extra: uv pip install -e ".[redis]"
#   See docs/user-guide/redis-setup.md
#
experiment_name: example-redis-local-bayesian

data_paths:
  - ./input_data/pdfs/sample.pdf

queries_file: ./configs/questions.example.json

database_provider: redis

embedding:
  provider: local
  models:
    - all-MiniLM-L6-v2

chunking:
  methods:
    - recursive
  params:
    # Expanded grid-equivalent candidate space for Bayesian tuning.
    # Candidate product target: 10 × 10 = 100
    chunk_sizes: [256, 320, 384, 448, 512, 576, 640, 704, 768, 832]
    overlaps: [0, 5, 10, 15, 20, 25, 30, 40, 50, 60]
    paddings: [0]

retrieval:
  top_k_initial: 20
  top_k_final: 5
  retrievers:
    - type: dense

execution:
  parallelism: 1
  on_error: continue
  search_strategy: bayesian
