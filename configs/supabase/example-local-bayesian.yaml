# Bayesian conversion of a non-Bayesian local example
#
# Source example: example-local.yaml (supabase)
#
# Bayesian behavior:
# - 1 embedding model × 1 chunking method × 1 padding × 1 retriever
# - chunk_sizes and overlaps explored via Optuna TPE
# - total runtime runs = execution.bayesian.n_trials

# Postgres / Supabase prerequisites:
#   - STORAGE_BACKEND=postgres
#   - DATABASE_URL=postgresql://... (local :5433 or Supabase URI)
#   - Schema auto-applied on server boot (no manual indexes)
#   - Dense, sparse, and hybrid retrieval work on Postgres (tsvector + RRF)
#   See docs/user-guide/postgres-setup.md
#
experiment_name: example-supabase-local-bayesian

data_paths:
  - ./input_data/pdfs/The_Federal_Pell_Grant_Program.pdf

queries_file: ./configs/questions.example.json

database_provider: supabase

embedding:
  provider: local
  models:
    - all-MiniLM-L6-v2

chunking:
  methods:
    - recursive
  params:
    # Expanded grid-equivalent candidate space for Bayesian tuning.
    # Candidate product target: 10 × 10 = 100
    chunk_sizes: [256, 320, 384, 448, 512, 576, 640, 704, 768, 832]
    overlaps: [0, 5, 10, 15, 20, 25, 30, 40, 50, 60]
    paddings: [0]

retrieval:
  top_k_initial: 20
  top_k_final: 5
  retrievers:
    - type: dense

execution:
  parallelism: 1
  on_error: continue
  search_strategy: bayesian
