# rag-params-finder — server + dashboard (MongoDB Atlas external)
# Prod:  docker compose up --build -d
# Dev:   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d

name: ${COMPOSE_PROJECT_NAME:-rag-params-finder}

services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: ${SERVER_IMAGE_NAME:-rag-params-finder-server}
    container_name: ${SERVER_CONTAINER_NAME:-rag-params-finder-server}
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      # Cloud: MONGODB_URI from .env. Local Atlas: RAG_SERVER_MONGODB_URI set by start-services.sh --mongodb-local
      MONGODB_URI: ${RAG_SERVER_MONGODB_URI:-${MONGODB_URI}}
      MONGODB_STORAGE_LIMIT_MB: ${RAG_MONGODB_STORAGE_LIMIT_MB:-${MONGODB_STORAGE_LIMIT_MB:-}}
      # Default remains mongodb until Slice 38 cutover gates PASS (then flip to postgres).
      # Local pgvector: RAG_SERVER_DATABASE_URL set by start-services.sh --postgres-local
      # Supabase: DATABASE_URL (or SUPABASE_URI alias) from .env (Slice 37)
      # Mongo modes export STORAGE_BACKEND=mongodb so leftover postgres env cannot stick.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-mongodb}
      DATABASE_URL: ${RAG_SERVER_DATABASE_URL:-${DATABASE_URL:-}}
      HF_HOME: ${HF_HOME:-/root/.cache/huggingface}
      # SIE is opt-in — remote gateway preferred (SIE_ENDPOINT + SIE_API_KEY in .env).
      # Self-hosted Docker fallback: docs/user-guide/sie-setup.md
      SIE_ENABLED: ${SIE_ENABLED:-false}
      SIE_ENDPOINT: ${SIE_ENDPOINT:-http://host.docker.internal:8720}
      SIE_API_KEY: ${SIE_API_KEY:-}
      AIM_REPO: /app/.aim
      GIT_COMMIT: ${GIT_COMMIT:-}
      GIT_BRANCH: ${GIT_BRANCH:-}
    volumes:
      - ./configs:/app/configs:ro
      - ./input_data:/app/input_data:ro
      - ./.aim:/app/.aim
      - hf_cache:/root/.cache/huggingface
    depends_on:
      mongodb-local:
        condition: service_healthy
        required: false
      postgres-local:
        condition: service_healthy
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: http://localhost:8001
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: ${FRONTEND_IMAGE_NAME:-rag-params-finder-frontend}
    container_name: ${FRONTEND_CONTAINER_NAME:-rag-params-finder-frontend}
    ports:
      - "5374:5374"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5374/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Aim experiment UI — opt-in: docker compose --profile aim up -d aim-ui
  # Or: ./scripts/aim-ui.sh
  aim-ui:
    profiles: ["aim"]
    image: ${SERVER_IMAGE_NAME:-rag-params-finder-server}
    container_name: ${AIM_UI_CONTAINER_NAME:-rag-params-finder-aim-ui}
    depends_on:
      server:
        condition: service_started
    ports:
      - "43800:43800"
    volumes:
      - ./.aim:/app/.aim
    working_dir: /app
    environment:
      AIM_REPO: /app/.aim
    command:
      [
        "aim",
        "up",
        "--repo",
        "/app",
        "--host",
        "0.0.0.0",
        "--port",
        "43800",
        "-y",
        "--workers",
        "1",
      ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:43800/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # MongoDB Atlas Local — opt-in: ./start-services.sh --mongodb-local
  # Canonical profile matches storage_mode; local-atlas is a deprecated alias.
  # Runs a full single-node Atlas replica set locally; supports $vectorSearch and $search.
  # CLI on host: export MONGODB_URI from scripts/lib/compose.sh (RAG_LOCAL_MONGODB_URI_HOST)
  # See docs/user-guide/mongodb-setup.md
  mongodb-local:
    profiles: ["mongodb-local", "local-atlas"]
    # Pin 8.3.x — volumes from prior :latest often have FCV 8.3; 8.0.x refuses them
    # (exit 62) and Compose waits forever. Downgrade below volume FCV → mongodb reset.
    image: mongodb/mongodb-atlas-local:8.3.3
    container_name: ${MONGODB_LOCAL_CONTAINER_NAME:-rag-params-finder-mongodb-local}
    ports:
      - "27017:27017"
    # All three paths must be named volumes — mounting only /data/db loses the
    # replica-set keyfile in /data/configdb on restart (Unable to acquire security key[s]).
    volumes:
      - mongodb_local_data:/data/db
      - mongodb_local_configdb:/data/configdb
      - mongodb_local_mongot:/data/mongot
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  # Local Postgres + pgvector — opt-in: ./start-services.sh --postgres-local
  # Canonical profile matches storage_mode; local-postgres is a deprecated alias.
  # Stands in for hosted Supabase so the Postgres backend can be developed and
  # tested without a cloud account. The server applies server/db/schema.sql on boot.
  # CLI on host: export DATABASE_URL from scripts/lib/compose.sh (RAG_LOCAL_DATABASE_URL_HOST)
  postgres-local:
    profiles: ["postgres-local", "local-postgres"]
    # Pin pgvector + PG major (not floating :pg16). 0.8.x required for hnsw.iterative_scan.
    image: pgvector/pgvector:0.8.5-pg16
    container_name: ${POSTGRES_LOCAL_CONTAINER_NAME:-rag-params-finder-postgres-local}
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag_params_finder}
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag_params_finder}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  hf_cache:
  postgres_local_data:
  mongodb_local_data:
  mongodb_local_configdb:
  mongodb_local_mongot:
