# Nginx configuration for rag-params-finder frontend SPA
# Serves built dist/ on port 5374 with SPA fallback routing

server {
    listen 5374;
    listen [::]:5374;
    server_name localhost;

    # Gzip compression for assets
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    gzip_min_length 1000;

    # Root is the built dist directory
    root /app/dist;
    index index.html;

    # Health check endpoint (no files needed)
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # SPA routing: any file that doesn't exist → index.html
    # This allows client-side routing (React Router, etc.)
    location / {
        try_files $uri $uri/ /index.html;
        # Disable caching for index.html to ensure version updates
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Cache static assets (JS, CSS, images) aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
    }
}
