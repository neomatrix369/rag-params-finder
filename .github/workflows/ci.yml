name: CI

# Ultra-minimal PR/push gates (aligned with quine-factory aggressive optimization).
# Deferred from this workflow (2026-09-11):
#   - Postgres / Mongo live integration → nightly.yml
#   - Docker build matrix → nightly.yml
#   - Container CVE scan + Trivy licenses → supply-chain.yml (weekly)
#   - Mutation testing → mutation.yml (1st + 15th)
#   - Code review graph → code-review-graph.yml (nightly schedule)
# Sibling workflows:
#   A nightly.yml       — daily 02:00 UTC
#   B supply-chain.yml  — Mon 03:00 UTC
#   C mutation.yml      — 1st+15th 02:00 UTC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend || 'false' }}
      frontend: ${{ steps.filter.outputs.frontend || 'false' }}
      repo: ${{ steps.filter.outputs.repo || 'false' }}
      deps: ${{ steps.filter.outputs.deps || 'false' }}

    steps:
      - name: Checkout for path filtering
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'server/**'
              - 'cli/**'
            frontend:
              - 'frontend/**'
            repo:
              - '.github/**'
              - '.pre-commit-config.yaml'
              - '.markdownlint.json'
              - '.gitleaks.toml'
              - 'CLAUDE.md'
              - 'AGENTS.md'
              - 'docs/**'
              - 'scripts/**'
            deps:
              - 'uv.lock'
              - 'pyproject.toml'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'

  repo-lint:
    name: Repo lint (shell, workflows, docs)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.repo == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies (pre-commit hooks)
        run: uv pip install --system -e ".[dev]"

      - name: Shellcheck
        run: pre-commit run shellcheck --all-files

      - name: Actionlint
        run: pre-commit run actionlint --all-files

      - name: Markdownlint
        run: pre-commit run markdownlint --all-files

  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (including dev)
        run: uv pip install --system -e ".[dev]"

      - name: Cache mypy
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: mypy-${{ runner.os }}-py3.12-

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy server/ cli/

      - name: SAST (bandit, medium+ severity)
        run: bandit -c pyproject.toml -r server/ cli/ -q -ll

      - name: Complexity (xenon — baseline E/C/C, target B/A/A)
        # Floor: E/C/C passes current code. Tighten as violations are refactored.
        # Violations blocking B/A/A tracked in docs/plan/slices/PROGRESS.md.
        run: xenon --max-absolute E --max-modules C --max-average C server/ cli/

      - name: Tests + coverage (unit tier — full backend)
        # Measures full server/ + cli/. Live Mongo/Postgres suites are deferred
        # to nightly.yml; integration-only paths are why full-backend coverage
        # lands below selective floors.
        # Floor: see pyproject.toml [tool.rag_params_finder.backend_coverage_thresholds].
        run: |
          mkdir -p .reports/coverage
          pytest --tb=short -q \
            --ignore=tests/contract \
            --ignore=tests/server/db/test_postgres_store_integration.py \
            --ignore=tests/server/db/test_postgres_dense_retrieval.py \
            --ignore=tests/server/db/test_postgres_sparse_hybrid.py \
            -m "not integration" \
            --cov=server \
            --cov=cli \
            --cov-report=term-missing \
            --cov-report=json:.reports/coverage/backend-full.json \
            --cov-fail-under=70
          python scripts/ci/check_backend_coverage_floors.py .reports/coverage/backend-full.json
          python scripts/ci/check_coverage_threshold_drift.py

  frontend:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Path is relative to repository root (not defaults.run.working-directory).
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Test with coverage (v8 thresholds + JUnit via vite.config)
        run: npm run test:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  dependency-audit:
    name: Dependency audit (PR + deps changes)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install backend dependencies (dev)
        run: uv pip install --system -e ".[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Path is relative to repository root (not defaults.run.working-directory).
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Python dependency audit
        run: bash scripts/ci/pip-audit.sh

      - name: Frontend security audit
        run: npm --prefix frontend audit --audit-level=high

  secrets:
    name: Secrets scan (diff-only)
    runs-on: ubuntu-latest
    needs: [changes]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Fetch base ref for PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: Configure gitleaks diff range
        id: gitleaks-range
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if git show-ref --verify --quiet "refs/remotes/origin/${{ github.base_ref }}"; then
              echo "range=origin/${{ github.base_ref }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Base ref origin/${{ github.base_ref }} not available; running full tree scan."
              echo "range=" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "range=" >> "$GITHUB_OUTPUT"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
            if ! git cat-file -e "${{ github.event.before }}^{commit}"; then
              echo "::warning::Base commit ${{ github.event.before }} is missing from checkout; running full tree scan."
              echo "range=" >> "$GITHUB_OUTPUT"
            elif ! git rev-list -n 1 $RANGE -- >/dev/null 2>&1; then
              echo "::warning::Gitleaks range '$RANGE' is not available in checkout; running full tree scan."
              echo "range=" >> "$GITHUB_OUTPUT"
            else
              echo "range=$RANGE" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Fast diff-only gitleaks (incremental range)
        if: steps.gitleaks-range.outputs.range != ''
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /workspace --config /workspace/.gitleaks.toml \
              --redact --log-opts "${{ steps.gitleaks-range.outputs.range }}"

      - name: Fast full-range gitleaks for first push/new branch
        if: steps.gitleaks-range.outputs.range == ''
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /workspace --config /workspace/.gitleaks.toml --redact
