name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend || steps.schedule_defaults.outputs.backend || 'false' }}
      frontend: ${{ steps.filter.outputs.frontend || steps.schedule_defaults.outputs.frontend || 'false' }}
      repo: ${{ steps.filter.outputs.repo || steps.schedule_defaults.outputs.repo || 'false' }}
      deps: ${{ steps.filter.outputs.deps || steps.schedule_defaults.outputs.deps || 'false' }}
      docker_files: ${{ steps.filter.outputs.docker_files || steps.schedule_defaults.outputs.docker_files || 'false' }}

    steps:
      - name: Checkout for path filtering
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'server/**'
              - 'cli/**'
            frontend:
              - 'frontend/**'
            repo:
              - '.github/**'
              - '.pre-commit-config.yaml'
              - '.markdownlint.json'
              - '.gitleaks.toml'
              - 'CLAUDE.md'
              - 'AGENTS.md'
              - 'docs/**'
              - 'scripts/**'
            docker_files:
              - 'docker/**'
              - 'docker-compose*.yml'
            deps:
              - 'uv.lock'
              - 'pyproject.toml'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'

      - name: Scheduled run defaults
        id: schedule_defaults
        if: github.event_name == 'schedule'
        run: |
          {
            echo "backend=false"
            echo "frontend=false"
            echo "repo=false"
            echo "docker_files=false"
            echo "deps=false"
          } >> "$GITHUB_OUTPUT"

  repo-lint:
    name: Repo lint (shell, workflows, docs)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'schedule' || needs.changes.outputs.repo == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies (pre-commit hooks)
        run: uv pip install --system -e ".[dev]"

      - name: Shellcheck
        run: pre-commit run shellcheck --all-files

      - name: Actionlint
        run: pre-commit run actionlint --all-files

      - name: Markdownlint
        run: pre-commit run markdownlint --all-files

  docker-build:
    name: Docker build validation (build-only, non-blocking)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'schedule' || needs.changes.outputs.docker_files == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}
    continue-on-error: true
    strategy:
      matrix:
        dockerfile:
          - docker/server.Dockerfile
          - docker/frontend.Dockerfile
          - docker/frontend.dev.Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.dockerfile }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'schedule' || needs.changes.outputs.backend == 'true' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (including dev)
        run: uv pip install --system -e ".[dev]"

      - name: Cache mypy
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: mypy-${{ runner.os }}-py3.12-

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy server/ cli/

      - name: SAST (bandit, medium+ severity)
        run: bandit -c pyproject.toml -r server/ cli/ -q -ll

      - name: Tests + coverage (unit tier)
        # Live Mongo/Postgres suites belong in the dedicated integration jobs —
        # collecting them here races on a shared local DB and skews coverage.
        run: |
          pytest --tb=short -q \
            --ignore=tests/contract \
            --ignore=tests/server/db/test_postgres_store_integration.py \
            --ignore=tests/server/db/test_postgres_dense_retrieval.py \
            --ignore=tests/server/db/test_postgres_sparse_hybrid.py \
            -m "not integration" \
            --cov=server.core.guards.search_index_plan \
            --cov=server.core.guards.search_index_guard \
            --cov=server.core.results_analyzer \
            --cov=server.models.config \
            --cov-report=term-missing \
            --cov-report=json:.reports/coverage-backend-unit.json \
            --cov-fail-under=95
          python scripts/ci/check_backend_coverage_floors.py .reports/coverage-backend-unit.json
          python scripts/ci/check_coverage_threshold_drift.py

  postgres-integration:
    name: Postgres integration (pgvector)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'schedule' || needs.changes.outputs.backend == 'true' }}

    # The Postgres adapter's SQL, JSONB mapping, and FK cascade can only be
    # proven against a real database — mocks would assert our own assumptions.
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_params_finder
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag_params_finder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (including dev)
        run: uv pip install --system -e ".[dev]"

      - name: Postgres StorageBackend and dense retrieval integration tests
        env:
          RAG_TEST_DATABASE_URL: postgresql://rag:rag@localhost:5433/rag_params_finder
          # Turns "database unreachable" from a skip into a failure, so a broken
          # service container cannot masquerade as a passing job.
          RAG_REQUIRE_POSTGRES: "1"
        # Coverage is enforced here rather than in the `backend` job: these tests
        # skip without a database, so the main job would measure them as 0%.
        # Contract suite is parametrized (mongo+postgres); the mongo param skips
        # here because only Postgres is provisioned.
        run: |
          pytest tests/server/db/test_postgres_store_integration.py \
                 tests/server/db/test_postgres_dense_retrieval.py \
                 tests/server/db/test_postgres_sparse_hybrid.py \
                 tests/contract/test_storage_backend_contract.py \
                 --tb=short -q -rs \
                 --cov=server.core.retrieval.retriever_postgres \
                 --cov-branch --cov-report=term-missing --cov-fail-under=95

  mongo-integration:
    name: Mongo integration (Atlas Local)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'schedule' || needs.changes.outputs.backend == 'true' }}

    # Live Mongo StorageBackend contract coverage — Atlas Local image matches
    # docker-compose.yml local-atlas profile. Mocks cannot prove port parity.
    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:8.3.3
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 60s

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies (including dev)
        run: uv pip install --system -e ".[dev]"

      - name: Mongo StorageBackend contract tests
        env:
          RAG_TEST_MONGODB_URI: mongodb://localhost:27017/rag_params_finder?directConnection=true
          RAG_REQUIRE_MONGO: "1"
          STORAGE_BACKEND: mongodb
        run: |
          pytest tests/contract/test_storage_backend_contract.py \
                 --tb=short -q -rs

  frontend:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'schedule' || needs.changes.outputs.frontend == 'true' }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Path is relative to repository root (not defaults.run.working-directory).
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Test with coverage (v8 thresholds + JUnit via vite.config)
        run: npm run test:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  dependency-audit:
    name: Dependency audit (PR + deps changes)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install backend dependencies (dev)
        run: uv pip install --system -e ".[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Path is relative to repository root (not defaults.run.working-directory).
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Python dependency audit
        run: bash scripts/ci/pip-audit.sh

      - name: Frontend security audit
        run: npm --prefix frontend audit --audit-level=high

  secrets:
    name: Secrets scan (diff-only)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Fetch base ref for PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: Configure gitleaks diff range
        id: gitleaks-range
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if git show-ref --verify --quiet "refs/remotes/origin/${{ github.base_ref }}"; then
              echo "range=origin/${{ github.base_ref }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Base ref origin/${{ github.base_ref }} not available; running full tree scan."
              echo "range=" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "range=" >> "$GITHUB_OUTPUT"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
            if ! git cat-file -e "${{ github.event.before }}^{commit}"; then
              echo "::warning::Base commit ${{ github.event.before }} is missing from checkout; running full tree scan."
              echo "range=" >> "$GITHUB_OUTPUT"
            elif ! git rev-list -n 1 $RANGE -- >/dev/null 2>&1; then
              echo "::warning::Gitleaks range '$RANGE' is not available in checkout; running full tree scan."
              echo "range=" >> "$GITHUB_OUTPUT"
            else
              echo "range=$RANGE" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Fast diff-only gitleaks (incremental range)
        if: steps.gitleaks-range.outputs.range != ''
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /workspace --config /workspace/.gitleaks.toml \
              --redact --log-opts "${{ steps.gitleaks-range.outputs.range }}"

      - name: Fast full-range gitleaks for first push/new branch
        if: steps.gitleaks-range.outputs.range == ''
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /workspace --config /workspace/.gitleaks.toml --redact

  license-check:
    name: License compliance (Trivy)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'schedule' || needs.changes.outputs.deps == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - name: License scan — block on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          exit-code: "1"
          format: table
          scanners: license
          severity: HIGH,CRITICAL

  container-scan:
    name: Container scan — server image (Trivy CVE, non-blocking)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'schedule' || needs.changes.outputs.docker_files == 'true' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build server image (load to daemon for scanning)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/server.Dockerfile
          push: false
          load: true
          tags: scan-target:${{ github.sha }}
          cache-from: type=gha

      - name: Scan image — HIGH/CRITICAL CVEs
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: scan-target:${{ github.sha }}
          exit-code: "1"
          severity: HIGH,CRITICAL
          format: table
          ignore-unfixed: true
          trivyignores: .trivyignore
