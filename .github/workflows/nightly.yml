name: Nightly

# Bundle A — Daily deep checks (02:00 UTC)
# Deferred from push CI (aggressive optimization 2026-09-11):
#   - Postgres / Mongo live integration (service containers)
#   - Docker build matrix (3 Dockerfiles)
#   - Full secrets / TruffleHog history
#   - Coverage snapshots + complexity trending
#   - Semgrep SAST + OSV SCA; frontend knip/jscpd trend (report only)
#
# Sibling workflows:
#   B supply-chain.yml — weekly Mon 03:00 UTC — SBOM · licenses · Meterian · container-scan · Chalk
#   C mutation.yml     — 1st+15th 02:00 UTC  — mutmut + Stryker (advisory)
#   D code-review-graph.yml — same 02:00 UTC cron — graph review

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC every night
  workflow_dispatch:

jobs:
  # ── Unit + coverage snapshots ────────────────────────────────────────────────
  nightly-tests-python:
    name: Python tests + coverage (nightly snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv pip install --system -e ".[dev]"
      - name: Complexity gate (xenon — baseline E/C/C, target B/A/A)
        run: xenon --max-absolute E --max-modules C --max-average C server/ cli/
      - run: mkdir -p .test-results .reports/coverage
      - run: |
          uv run pytest --tb=short -q \
            --ignore=tests/contract \
            --ignore=tests/server/db/test_postgres_store_integration.py \
            --ignore=tests/server/db/test_postgres_dense_retrieval.py \
            --ignore=tests/server/db/test_postgres_sparse_hybrid.py \
            -m "not integration" \
            --cov=server \
            --cov=cli \
            --cov-report=term-missing \
            --cov-report="html:.reports/coverage/html" \
            --cov-report="xml:.reports/coverage/coverage.xml" \
            --cov-report="json:.reports/coverage/backend-full.json" \
            --cov-fail-under=70 \
            --junitxml=.test-results/junit.xml
          uv run python scripts/ci/check_backend_coverage_floors.py .reports/coverage/backend-full.json
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-test-results-python-${{ github.run_number }}
          path: .test-results/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-coverage-python-${{ github.run_number }}
          path: .reports/coverage/
          retention-days: 30
          if-no-files-found: warn

  nightly-tests-node:
    name: Node tests + coverage (nightly snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-test-results-node-${{ github.run_number }}
          path: .test-results/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-coverage-node-${{ github.run_number }}
          path: .reports/coverage/frontend/
          retention-days: 30
          if-no-files-found: warn

  nightly-complexity:
    name: Complexity report (nightly snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPLEXITY_PYTHON_PATHS: server cli
      COMPLEXITY_NODE_WORKSPACES: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv pip install --system -e ".[dev]"
      - run: (cd frontend && npm ci)
      - run: bash scripts/complexity-report.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-complexity-${{ github.run_number }}
          path: .reports/complexity/
          retention-days: 30
          if-no-files-found: warn

  # ── Deferred from PR CI: live vector-store integration (skipped ≠ green) ──
  vector-store-integration:
    name: Vector store integration (${{ matrix.store }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - store: postgres
            image: pgvector/pgvector:0.8.5-pg16
            port: "5433:5432"
            health_options: >-
              --health-cmd "pg_isready -U rag -d rag_params_finder"
              --health-interval 5s --health-timeout 5s --health-retries 12
            pytest_args: >-
              tests/server/db/test_postgres_store_integration.py
              tests/server/db/test_postgres_dense_retrieval.py
              tests/server/db/test_postgres_sparse_hybrid.py
              tests/contract/test_storage_backend_contract.py
              --cov=server.core.retrieval.retriever_postgres
              --cov-branch --cov-report=term-missing --cov-fail-under=95
            require_env: RAG_REQUIRE_POSTGRES=1
            extra_env: RAG_TEST_DATABASE_URL=postgresql://rag:rag@localhost:5433/rag_params_finder
            service_env: |
              POSTGRES_USER=rag
              POSTGRES_PASSWORD=rag
              POSTGRES_DB=rag_params_finder
            install_spec: ".[dev]"
          - store: mongodb
            image: mongodb/mongodb-atlas-local:8.3.3
            port: "27017:27017"
            health_options: >-
              --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
              --health-interval 10s --health-timeout 5s --health-retries 12
              --health-start-period 60s
            pytest_args: tests/contract/test_storage_backend_contract.py
            require_env: RAG_REQUIRE_MONGO=1
            extra_env: RAG_TEST_MONGODB_URI=mongodb://localhost:27017/rag_params_finder?directConnection=true
            service_env: ""
            install_spec: ".[dev]"
          - store: elasticsearch
            image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
            port: "9200:9200"
            health_options: >-
              --health-cmd "curl -sf http://localhost:9200/_cluster/health"
              --health-interval 10s --health-timeout 5s --health-retries 18
              --health-start-period 40s
            pytest_args: >-
              tests/server/db/test_elasticsearch_live.py
              tests/server/test_split_store_e2e.py
            require_env: RAG_REQUIRE_ELASTICSEARCH=1
            extra_env: ELASTICSEARCH_URL=http://127.0.0.1:9200
            service_env: |
              discovery.type=single-node
              xpack.security.enabled=false
              xpack.license.self_generated.type=basic
              ES_JAVA_OPTS=-Xms1g -Xmx1g
            install_spec: ".[dev,elasticsearch]"
    services:
      store:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_params_finder
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.license.self_generated.type: basic
          ES_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports:
          - ${{ matrix.port }}
        options: ${{ matrix.health_options }}
    steps:
      - uses: actions/checkout@v7
      - name: Raise vm.max_map_count for Elasticsearch
        if: matrix.store == 'elasticsearch'
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv pip install --system -e "${{ matrix.install_spec }}"
      - name: Live ${{ matrix.store }} tests
        env:
          RAG_REQUIRE_POSTGRES: ${{ matrix.store == 'postgres' && '1' || '' }}
          RAG_REQUIRE_MONGO: ${{ matrix.store == 'mongodb' && '1' || '' }}
          RAG_REQUIRE_ELASTICSEARCH: ${{ matrix.store == 'elasticsearch' && '1' || '' }}
          RAG_TEST_DATABASE_URL: ${{ matrix.store == 'postgres' && 'postgresql://rag:rag@localhost:5433/rag_params_finder' || '' }}
          RAG_TEST_MONGODB_URI: ${{ matrix.store == 'mongodb' && 'mongodb://localhost:27017/rag_params_finder?directConnection=true' || '' }}
          ELASTICSEARCH_URL: ${{ matrix.store == 'elasticsearch' && 'http://127.0.0.1:9200' || '' }}
          STORAGE_BACKEND: ${{ matrix.store == 'postgres' && 'postgres' || 'mongodb' }}
        run: pytest ${{ matrix.pytest_args }} --tb=short -q -rs

  vector-store-integration-summary:
    name: Vector store integration summary (skipped ≠ green)
    needs: vector-store-integration
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every matrix leg succeeded
        run: |
          result="${{ needs.vector-store-integration.result }}"
          echo "vector-store-integration result=${result}"
          test "${result}" = "success"

  # ── Deferred from PR CI: Docker build validation ────────────────────────────
  docker-build:
    name: Docker build validation (build-only, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      matrix:
        dockerfile:
          - docker/server.Dockerfile
          - docker/frontend.Dockerfile
          - docker/frontend.dev.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.dockerfile }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── SAST + SCA (same packs/waivers as scripts/security/security-scan.sh) ────
  sast-semgrep:
    name: Semgrep SAST (OWASP · Python · JS · secrets — ERROR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.172.0
    steps:
      - uses: actions/checkout@v7
      - run: >-
          semgrep scan --config p/owasp-top-ten --config p/python
          --config p/javascript --config p/secrets --severity ERROR --error .

  sca-osv:
    name: OSV-Scanner SCA (uv.lock + package-lock.json)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: OSV-Scanner (waivers mirror pip-audit.sh — osv-scanner.toml)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src \
            ghcr.io/google/osv-scanner:v2.4.0 \
            scan source -r --config osv-scanner.toml .

  # ── Frontend hygiene trend (report only — baseline, not a gate) ────────────
  frontend-hygiene-report:
    name: Frontend dead exports + duplication (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dead exports (knip)
        run: |
          mkdir -p ../.reports/hygiene
          npx --yes knip@6.38.0 --no-progress --reporter markdown > ../.reports/hygiene/knip.md || true
      - name: Duplication (jscpd — baseline 6.2%, target ≤5%)
        run: npx --yes jscpd@5.3.2 src --min-lines 6 --reporters markdown,console --output ../.reports/hygiene/jscpd || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-frontend-hygiene-${{ github.run_number }}
          path: .reports/hygiene/
          retention-days: 30
          if-no-files-found: warn

  # ── Full-history secrets ────────────────────────────────────────────────────
  trufflehog-full:
    name: TruffleHog (full git history)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.97.1
        with:
          path: ./
          base: ""
          extra_args: --only-verified --exclude-detectors=Lob

  dependency-audit:
    name: Dependency audit (full lockfile sweep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install backend dependencies (dev)
        run: uv pip install --system -e ".[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Python dependency audit
        run: bash scripts/ci/pip-audit.sh

      - name: Frontend security audit
        run: npm --prefix frontend audit --audit-level=high

  full-secrets-scan:
    name: Full-history secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore last-secrets-scan marker
        id: restore-secrets-marker
        uses: actions/cache@v6
        with:
          path: .github/.cache/last-secrets-scan-sha
          key: gitleaks-full-scan-marker

      - name: Check if any new commits since last full scan
        id: secrets-scan-gate
        run: |
          LAST_SHA=""
          if [ -f .github/.cache/last-secrets-scan-sha ]; then
            LAST_SHA="$(cat .github/.cache/last-secrets-scan-sha)"
          fi
          echo "last_scan_sha=${LAST_SHA}" >> "$GITHUB_OUTPUT"
          if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "${{ github.sha }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Full-history gitleaks
        if: steps.secrets-scan-gate.outputs.skip != 'true'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /workspace --config /workspace/.gitleaks.toml \
              --redact --log-opts "--all"

      - name: Update last-secrets-scan marker
        if: steps.secrets-scan-gate.outputs.skip != 'true'
        run: |
          mkdir -p .github/.cache
          echo "${{ github.sha }}" > .github/.cache/last-secrets-scan-sha

      - name: Cache last-secrets-scan marker
        if: steps.secrets-scan-gate.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: .github/.cache/last-secrets-scan-sha
          key: gitleaks-full-scan-marker
