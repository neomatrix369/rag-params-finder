name: Nightly

# Bundle A — Daily deep checks (02:00 UTC)
# Deferred from push CI (aggressive optimization 2026-09-11):
#   - Postgres / Mongo live integration (service containers)
#   - Docker build matrix (3 Dockerfiles)
#   - Full secrets / TruffleHog history
#   - Coverage snapshots + complexity trending
#
# Sibling workflows:
#   B supply-chain.yml — weekly Mon 03:00 UTC — SBOM · licenses · Meterian · container-scan · Chalk
#   C mutation.yml     — 1st+15th 02:00 UTC  — mutmut + Stryker (advisory)
#   D code-review-graph.yml — same 02:00 UTC cron — graph review

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC every night
  workflow_dispatch:

jobs:
  # ── Unit + coverage snapshots ────────────────────────────────────────────────
  nightly-tests-python:
    name: Python tests + coverage (nightly snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv pip install --system -e ".[dev]"
      - name: Complexity gate (xenon — baseline E/C/C, target B/A/A)
        run: xenon --max-absolute E --max-modules C --max-average C server/ cli/
      - run: mkdir -p .test-results .reports/coverage
      - run: |
          uv run pytest --tb=short -q \
            --ignore=tests/contract \
            --ignore=tests/server/db/test_postgres_store_integration.py \
            --ignore=tests/server/db/test_postgres_dense_retrieval.py \
            --ignore=tests/server/db/test_postgres_sparse_hybrid.py \
            -m "not integration" \
            --cov=server \
            --cov=cli \
            --cov-report=term-missing \
            --cov-report="html:.reports/coverage/html" \
            --cov-report="xml:.reports/coverage/coverage.xml" \
            --cov-report="json:.reports/coverage/backend-full.json" \
            --cov-fail-under=70 \
            --junitxml=.test-results/junit.xml
          uv run python scripts/ci/check_backend_coverage_floors.py .reports/coverage/backend-full.json
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-test-results-python-${{ github.run_number }}
          path: .test-results/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-coverage-python-${{ github.run_number }}
          path: .reports/coverage/
          retention-days: 30
          if-no-files-found: warn

  nightly-tests-node:
    name: Node tests + coverage (nightly snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-test-results-node-${{ github.run_number }}
          path: .test-results/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-coverage-node-${{ github.run_number }}
          path: .reports/coverage/frontend/
          retention-days: 30
          if-no-files-found: warn

  nightly-complexity:
    name: Complexity report (nightly snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPLEXITY_PYTHON_PATHS: server cli
      COMPLEXITY_NODE_WORKSPACES: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv pip install --system -e ".[dev]"
      - run: (cd frontend && npm ci)
      - run: bash scripts/complexity-report.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-complexity-${{ github.run_number }}
          path: .reports/complexity/
          retention-days: 30
          if-no-files-found: warn

  # ── Deferred from PR CI: live DB integration ────────────────────────────────
  postgres-integration:
    name: Postgres integration (pgvector) — deferred from PR CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_params_finder
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag_params_finder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies (including dev)
        run: uv pip install --system -e ".[dev]"
      - name: Postgres StorageBackend and dense retrieval integration tests
        env:
          RAG_TEST_DATABASE_URL: postgresql://rag:rag@localhost:5433/rag_params_finder
          RAG_REQUIRE_POSTGRES: "1"
        run: |
          pytest tests/server/db/test_postgres_store_integration.py \
                 tests/server/db/test_postgres_dense_retrieval.py \
                 tests/server/db/test_postgres_sparse_hybrid.py \
                 tests/contract/test_storage_backend_contract.py \
                 --tb=short -q -rs \
                 --cov=server.core.retrieval.retriever_postgres \
                 --cov-branch --cov-report=term-missing --cov-fail-under=95

  mongo-integration:
    name: Mongo integration (Atlas Local) — deferred from PR CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:8.3.3
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies (including dev)
        run: uv pip install --system -e ".[dev]"
      - name: Mongo StorageBackend contract tests
        env:
          RAG_TEST_MONGODB_URI: mongodb://localhost:27017/rag_params_finder?directConnection=true
          RAG_REQUIRE_MONGO: "1"
          STORAGE_BACKEND: mongodb
        run: |
          pytest tests/contract/test_storage_backend_contract.py \
                 --tb=short -q -rs

  # ── Deferred from PR CI: Docker build validation ────────────────────────────
  docker-build:
    name: Docker build validation (build-only, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      matrix:
        dockerfile:
          - docker/server.Dockerfile
          - docker/frontend.Dockerfile
          - docker/frontend.dev.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.dockerfile }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Full-history secrets ────────────────────────────────────────────────────
  trufflehog-full:
    name: TruffleHog (full git history)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.97.1
        with:
          path: ./
          base: ""
          extra_args: --only-verified --exclude-detectors=Lob

  dependency-audit:
    name: Dependency audit (full lockfile sweep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install backend dependencies (dev)
        run: uv pip install --system -e ".[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Python dependency audit
        run: bash scripts/ci/pip-audit.sh

      - name: Frontend security audit
        run: npm --prefix frontend audit --audit-level=high

  full-secrets-scan:
    name: Full-history secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore last-secrets-scan marker
        id: restore-secrets-marker
        uses: actions/cache@v6
        with:
          path: .github/.cache/last-secrets-scan-sha
          key: gitleaks-full-scan-marker

      - name: Check if any new commits since last full scan
        id: secrets-scan-gate
        run: |
          LAST_SHA=""
          if [ -f .github/.cache/last-secrets-scan-sha ]; then
            LAST_SHA="$(cat .github/.cache/last-secrets-scan-sha)"
          fi
          echo "last_scan_sha=${LAST_SHA}" >> "$GITHUB_OUTPUT"
          if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "${{ github.sha }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Full-history gitleaks
        if: steps.secrets-scan-gate.outputs.skip != 'true'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /workspace --config /workspace/.gitleaks.toml \
              --redact --log-opts "--all"

      - name: Update last-secrets-scan marker
        if: steps.secrets-scan-gate.outputs.skip != 'true'
        run: |
          mkdir -p .github/.cache
          echo "${{ github.sha }}" > .github/.cache/last-secrets-scan-sha

      - name: Cache last-secrets-scan marker
        if: steps.secrets-scan-gate.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: .github/.cache/last-secrets-scan-sha
          key: gitleaks-full-scan-marker
