name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC every night
  workflow_dispatch:

jobs:
  # ── T4: Mutation testing — Python (mutmut) ────────────────────────────────────
  mutation-tests-python:
    name: Mutation testing — Python (mutmut)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv pip install --system -e ".[dev]" mutmut
      - name: Run mutation tests
        run: |
          mutmut run --paths-to-mutate server/ cli/ || true
          mutmut results || true
          mutmut junitxml > mutation-results-python.xml || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-python-${{ github.run_number }}
          path: mutation-results-python.xml
          retention-days: 30

  # ── T4: Mutation testing — Node/TS (Stryker) ──────────────────────────────────
  mutation-tests-node:
    name: Mutation testing — Node (Stryker)
    runs-on: ubuntu-latest
    # Safety net only — Must is narrowed mutate scope (Slice 44 Residual §4 / #163)
    timeout-minutes: 90
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run Stryker mutation tests
        run: npx stryker run || true
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mutation-node-${{ github.run_number }}
          path: frontend/reports/mutation/
          retention-days: 30
          if-no-files-found: warn

  # ── T4: TruffleHog full git-history scan ─────────────────────────────────────
  trufflehog-full:
    name: TruffleHog (full git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.95.9
        with:
          path: ./
          base: ""
          extra_args: --only-verified

  # ── T4: SBOM — CycloneDX artifact (whole repo) ───────────────────────────────
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: anchore/sbom-action@v0.17.0
        with:
          format: cyclonedx-json
          output-file: sbom.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-${{ github.run_number }}
          path: sbom.json
          retention-days: 90
      - name: License compliance (trivy) — block on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          exit-code: "1"
          format: table
          scanners: license
          severity: HIGH,CRITICAL

  # ── T4: Meterian — SCA + license (OSS path; no token — public MIT repo) ─────
  # Stack: Python 3.12 (pyproject.toml + uv.lock) + Node/React (frontend/package-lock.json).
  # Not a Java project — do not rely on auto-detect; pin scanners explicitly.
  # Docs: https://docs.meterian.io/the-client/command-line-parameters/selecting-scanners.md
  #       https://docs.meterian.io/the-client/command-line-parameters/producing-reports.md
  # Exclusions: root `.meterian` (CVE/library waivers; Trivy parity — see that file + .trivyignore).
  # Reports: HTML + JUnit + SARIF + SBOM (CycloneDX + Meterian CSV) for OSS.
  # JSON/PDF analysis reports need enterprise — skip those.
  # Meterian SBOM archived here for vendor comparison with the anchore sbom job.
  # Inputs: MeterianHQ/meterian-github-action@v1.0.17 → oss + cli_args
  meterian:
    name: Meterian SCA + license
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Meterian report directory
        run: mkdir -p meterian-reports
      - name: Meterian Scanner
        uses: MeterianHQ/meterian-github-action@v1.0.17
        with:
          oss: true
          # enabled-scanners → only python + nodejs (frontend npm)
          # scan-*=true → fail closed if manifests missing
          # scan-java=false → belt-and-suspenders (no pom/gradle here)
          # exclude-folders → skip build/cache trees Meterian need not walk
          # scan-javascript left off (vanilla JS crawler is opt-in; we use nodejs lockfile)
          # report-* → archiveable CI outputs (dir must exist before scan)
          # report-sbom → .cdx.json for Anchore parity; .csv for Meterian-native SBOM
          cli_args: >-
            --min-security=95
            --min-licensing=95
            --enabled-scanners=python,nodejs
            --scan-python=true
            --scan-nodejs=true
            --scan-java=false
            --exclude-folders=.venv,frontend/node_modules,frontend/dist,.aim,.pytest_cache,.mypy_cache,.ruff_cache,htmlcov,.tox
            --report-console=nocolor,security,licensing
            --report-file=meterian-reports/report.html
            --report-junit=meterian-reports/report.xml
            --report-sarif=meterian-reports/report.sarif
            --report-sbom=meterian-reports/sbom.cdx.json,meterian-reports/sbom.csv
      - name: Upload Meterian reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meterian-${{ github.run_number }}
          path: meterian-reports/
          retention-days: 90
          if-no-files-found: warn

  # ── T4: Container image scan (only when server Dockerfile is present) ───────────
  container-scan:
    name: Container scan (Trivy image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for Dockerfile
        id: check
        run: echo "exists=$(test -f docker/server.Dockerfile && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Build image
        if: steps.check.outputs.exists == 'true'
        run: docker build -f docker/server.Dockerfile -t scan-target:${{ github.sha }} .
      - name: Scan image
        if: steps.check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: scan-target:${{ github.sha }}
          exit-code: "1"
          severity: HIGH,CRITICAL
          format: table
          ignore-unfixed: true     # suppress OS CVEs with no distro patch yet (e.g. linux-libc-dev, perl toolchain from build-essential)
          trivyignores: .trivyignore  # Python CVEs blocked by transitive dep constraints — see .trivyignore for rationale

  # ── T4: Chalk — software provenance + build attestation ─────────────────────
  chalk:
    name: Chalk (provenance + attestation)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Sigstore keyless signing
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set up Chalk
        uses: crashappsec/setup-chalk-action@v0.0.3
      - name: Chalk mark source artifacts
        run: |
          chalk insert server/ cli/ scripts/
      - name: Chalk wrap Docker build (server image)
        if: hashFiles('docker/server.Dockerfile') != ''
        run: |
          chalk docker build -f docker/server.Dockerfile -t chalk-attested-server:${{ github.sha }} .
      - name: Upload Chalk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chalk-report-${{ github.run_number }}
          path: ~/.local/chalk/chalk.log
          retention-days: 90
          if-no-files-found: warn

  # ── T4: DAST — OWASP ZAP baseline (uncomment when Docker service is present) ──
  # dast:
  #   name: DAST — OWASP ZAP baseline
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - name: Start service
  #       run: docker compose up -d && sleep 10
  #     - name: ZAP baseline scan
  #       uses: zaproxy/action-baseline@v0.12.0
  #       with:
  #         target: 'http://localhost:8001'
  #         rules_file_name: '.zap/rules.tsv'
  #         cmd_options: '-I'
  #     - name: Stop service
  #       if: always()
  #       run: docker compose down

  # ── Dependency audit (full lockfile sweep) ────────────────────────────────
  dependency-audit:
    name: Dependency audit (full lockfile sweep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install backend dependencies (dev)
        run: uv pip install --system -e ".[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Python dependency audit
        run: bash scripts/ci/pip-audit.sh

      - name: Frontend security audit
        run: npm --prefix frontend audit --audit-level=high

  # ── Full-history secrets scan (gitleaks) ─────────────────────────────────
  full-secrets-scan:
    name: Full-history secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore last-secrets-scan marker
        id: restore-secrets-marker
        uses: actions/cache@v6
        with:
          path: .github/.cache/last-secrets-scan-sha
          key: gitleaks-full-scan-marker

      - name: Check if any new commits since last full scan
        id: secrets-scan-gate
        run: |
          LAST_SHA=""
          if [ -f .github/.cache/last-secrets-scan-sha ]; then
            LAST_SHA="$(cat .github/.cache/last-secrets-scan-sha)"
          fi
          echo "last_scan_sha=${LAST_SHA}" >> "$GITHUB_OUTPUT"
          if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "${{ github.sha }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Full-history gitleaks
        if: steps.secrets-scan-gate.outputs.skip != 'true'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /workspace --config /workspace/.gitleaks.toml \
              --redact --log-opts "--all"

      - name: Update last-secrets-scan marker
        if: steps.secrets-scan-gate.outputs.skip != 'true'
        run: |
          mkdir -p .github/.cache
          echo "${{ github.sha }}" > .github/.cache/last-secrets-scan-sha

      - name: Cache last-secrets-scan marker
        if: steps.secrets-scan-gate.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: .github/.cache/last-secrets-scan-sha
          key: gitleaks-full-scan-marker
